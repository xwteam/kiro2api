services:
  kiro2api:
    image: ghcr.io/xwteam/kiro2api:latest
    container_name: kiro2api
    env_file: .env
    environment:
      TZ: Asia/Shanghai
    # 宿主与容器端口都跟着 .env 里的 PORT 走(未设时 8080),
    # 否则改了 PORT 只会让容器换端口、映射还停在旧端口,宿主机上新旧端口都连不通。
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      # 与应用同一套端口优先级:PORT 环境变量 > data/config.json 的 port > 8080。
      # `$$` 是 compose 的转义,展开留给容器内的 shell,取的是容器实际生效的 PORT。
      test: ["CMD-SHELL", "P=\"$${PORT:-$$(grep -oE '\"port\"[[:space:]]*:[[:space:]]*[0-9]+' /app/data/config.json 2>/dev/null | grep -oE '[0-9]+' | head -1)}\"; wget -q -O /dev/null \"http://localhost:$${P:-8080}/health\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
