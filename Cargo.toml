# kiro2api — Anthropic/OpenAI/Gemini 多协议中转,后端 Kiro。
# 版本单一真源在 ./VERSION;此处 version 须与之保持一致。
[package]
name = "kiro2api"
version = "0.10.1"
edition = "2024"
license = "MIT"
authors = ["xwteam"]
publish = false

[[bin]]
name = "kiro2api"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true

[features]
# 默认走 native-tls(OpenSSL):真实 Kiro 客户端是 Electron/Node,TLS 握手用的是 OpenSSL,
# 其 ClientHello 指纹与 rustls 截然不同。TLS 指纹在任何 HTTP 内容发出**之前**就暴露,
# 是最标准的机器人识别手段之一 —— 故与真实客户端对齐。
# 关掉此特性则回落 rustls(编译更快、无需 OpenSSL 工具链,但指纹对不上)。
default = ["native-tls-backend"]
native-tls-backend = ["reqwest/native-tls-vendored"]

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
# gzip/brotli/deflate:**必须**与 Social 刷新声明的 `Accept-Encoding` 同时成立。真实桌面端
# 用 axios 打自家 auth 服务,固定声明 `gzip, compress, deflate, br`;我们要对齐这个声明,就
# 必须真能解开上游据此压缩的响应,否则每次刷新都拿到一堆压缩字节、JSON 解析全挂。
# 注意这会让 reqwest 给**没有**显式 accept-encoding 的请求自动补一个 —— 数据面不能带这个头
# (真实 aws-sdk-js on Node 不发),故 http.rs 里数据面/控制面客户端一律 no_gzip/no_brotli/
# no_deflate 关掉自动补,只在刷新那条链路上显式声明。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "socks", "http2", "charset", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crc = "3"
getrandom = "0.2"
hex = "0.4"
parking_lot = "0.12"
sha2 = "0.10"
subtle = "2.6"
rust-embed = "8"
mime_guess = "2"
url = "2"
async-stream = "0.3"
futures-core = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
